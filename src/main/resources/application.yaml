spring:
  application:
    name: contratos
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
          max-retries: 5
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8086

servicios:
  usuarios-url: ${USUARIOS_URL:http://localhost:8082}
  propiedades-url: ${PROPIEDADES_URL:http://localhost:8083}

r2:
  endpoint: ${R2_ENDPOINT:https://ACCOUNTID.r2.cloudflarestorage.com}
  bucket: ${R2_BUCKET_CONTRATOS:realtyhub-contratos}
  access-key: ${R2_ACCESS_KEY_ID:ejemplo-access-key}
  secret-key: ${R2_SECRET_ACCESS_KEY:ejemplo-secret-key}

contratos:
  pais-por-defecto: ${CONTRATOS_PAIS:CO}
  url-descarga-minutos: ${CONTRATOS_URL_DESCARGA_MINUTOS:10}
